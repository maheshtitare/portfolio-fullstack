<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mahesh | Portfolio</title>
    <!-- Google Fonts — Inter is clean and professional -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Global reset — removes default browser margin/padding */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0a0a0f;
        color: #e2e8f0;
        overflow-x: hidden;
      }
      /* Smooth scrolling for the whole page */
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body>
    <!-- React mounts the entire app into this div -->
    <div id="root"></div>
  </body>
</html>
